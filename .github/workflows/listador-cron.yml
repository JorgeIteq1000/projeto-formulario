name: Listador de Certificados (Cron 20 min)

on:
  schedule:
    # Executa a cada 20 minutos de forma autônoma na nuvem
    - cron: '*/20 * * * *'
  workflow_dispatch:
    # Permite execução manual a qualquer momento via painel do GitHub Actions

concurrency:
  group: listador-cron
  cancel-in-progress: false

jobs:
  executar-listador:
    name: Varredura de Certificados (Lyra -> Google Sheets)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Script do Listador (Lyra -> Google Sheets)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          LYRA_EMAIL: ${{ secrets.LYRA_EMAIL }}
          LYRA_PASSWORD: ${{ secrets.LYRA_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          python LISTADOR/listador-extensoes-aperf.py
