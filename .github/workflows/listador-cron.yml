name: Listador de Certificados (Cron 20 min)

on:
  schedule:
    # Executa a cada 20 minutos de forma autônoma na nuvem
    - cron: '*/20 * * * *'
  workflow_dispatch:
    # Permite execução manual a qualquer momento via painel do GitHub Actions

concurrency:
  group: listador-cron
  cancel-in-progress: false

jobs:
  executar-listador:
    name: Varredura de Certificados & Régua de WhatsApp
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Script do Listador (Lyra -> Google Sheets)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          LYRA_EMAIL: ${{ secrets.LYRA_EMAIL }}
          LYRA_PASSWORD: ${{ secrets.LYRA_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          python LISTADOR/listador-extensoes-aperf.py

      - name: Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências Node.js
        run: npm ci

      - name: Executar Régua Automatizada de WhatsApp (Zionic)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PUBLIC_FORM_URL: ${{ secrets.PUBLIC_FORM_URL || 'https://certificadoies.com.br' }}
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
          ZIONIC_API_URL: ${{ secrets.ZIONIC_API_URL || 'https://api.zionic.app' }}
          ZIONIC_EMAIL: ${{ secrets.ZIONIC_EMAIL }}
          ZIONIC_PASSWORD: ${{ secrets.ZIONIC_PASSWORD }}
          ZIONIC_BEARER_TOKEN: ${{ secrets.ZIONIC_BEARER_TOKEN }}
          ZIONIC_COMPANY_ID: ${{ secrets.ZIONIC_COMPANY_ID }}
          ZIONIC_WHATSAPP_INSTANCE_ID: ${{ secrets.ZIONIC_WHATSAPP_INSTANCE_ID }}
          ZIONIC_INTEGRATION_ID: ${{ secrets.ZIONIC_INTEGRATION_ID }}
          INTERVALO_DISPARO_SEGUNDOS: "60"
        run: |
          node Zionic/reguaWhatsApp.js --enviar
